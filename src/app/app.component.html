<!-- splash screen — rendered first, hides everything until appReady() -->
@if (!appReady()) {
  <app-splash-screen (done)="appReady.set(true)" />
}

@if (appReady()) {
  @if (!isMobile()) {
    <app-header />
  }

  <main [class.ready]="appReady()">
    <router-outlet />
  </main>

  <!-- Layers -->
  @if (!isMobile()) {
    <app-camera-overlay />
  }

  @if (!isMobile()) {
    <app-footer />
  }

  <!-- Mobile -->
  @if (isMobile()) {
    <app-nav-mobile />
  }
}

<div class="video-brackground">
  @if (backgroundVideoSrc()) {
    <video
      #video
      class="video"
      loop
      muted
      playsinline
      autoplay
      preload="metadata"
      disablePictureInPicture
      aria-hidden="true">
      <source [src]="backgroundVideoSrc()" type="video/webm" />
    </video>
  }
  @if (nextVideoSrc()) {
    <video style="display: none" muted preload="auto" aria-hidden="true">
      <source [src]="nextVideoSrc()" type="video/webm" />
    </video>
  }
</div>

<app-cursor />
